name: Build Apps in Toss AIT
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run ait:build
      - uses: actions/upload-artifact@v4
        with:
          name: principalcc-ait
          path: '*.ait'
          if-no-files-found: error